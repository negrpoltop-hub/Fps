name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Unpack project
        run: |
          unzip -q fpsmax.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle | head -n1)")
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fpsmax
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
